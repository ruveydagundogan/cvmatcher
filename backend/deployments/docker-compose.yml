services:
  postgres:
    image: postgres:16-alpine
    container_name: cvmatcher-postgres
    environment:
      POSTGRES_USER: cvmatcher
      POSTGRES_PASSWORD: cvmatcher
      POSTGRES_DB: cvmatcher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvmatcher -d cvmatcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cvmatcher-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
