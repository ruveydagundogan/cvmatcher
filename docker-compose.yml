services:
  ollama:
    image: ollama/ollama:latest
    container_name: cvmatcher-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cvmatcher-network

  postgres:
    image: postgres:16-alpine
    container_name: cvmatcher-postgres
    environment:
      POSTGRES_USER: cvmatcher
      POSTGRES_PASSWORD: cvmatcher
      POSTGRES_DB: cvmatcher
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvmatcher -d cvmatcher"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cvmatcher-network

  redis:
    image: redis:7-alpine
    container_name: cvmatcher-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cvmatcher-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: cvmatcher
      DB_PASSWORD: cvmatcher
      DB_NAME: cvmatcher
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-secret-do-not-use-in-production
      LOG_LEVEL: debug
      LOG_FORMAT: text
      BCRYPT_COST: "5"
      MLC_LLM_ENABLED: "true"
      MLC_LLM_BASE_URL: http://ollama:11434
      ADMIN_API_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cvmatcher-network

  prometheus:
    image: prom/prometheus:latest
    container_name: cvmatcher-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - cvmatcher-network

  grafana:
    image: grafana/grafana:latest
    container_name: cvmatcher-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cvmatcher-network

  nginx:
    image: nginx:alpine
    container_name: cvmatcher-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - cvmatcher-network

volumes:
  pgdata:
  redis-data:
  prometheus-data:
  grafana-data:
  ollama-data:

networks:
  cvmatcher-network:
    driver: bridge
