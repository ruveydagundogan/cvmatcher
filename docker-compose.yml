services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-decision-score-postgres
    environment:
      POSTGRES_USER: llmdecisionscore
      POSTGRES_PASSWORD: llmdecisionscore
      POSTGRES_DB: llmdecisionscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmdecisionscore -d llmdecisionscore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - llm-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: llm-decision-score-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: llmdecisionscore
      DB_PASSWORD: llmdecisionscore
      DB_NAME: llmdecisionscore
      DB_SSLMODE: disable
      JWT_SECRET: local-dev-secret-do-not-use-in-production
      LOG_LEVEL: debug
      LOG_FORMAT: text
      BCRYPT_COST: "5"
      MLC_LLM_ENABLED: "false"
      MLC_LLM_BASE_URL: http://mlc-llm:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm-network

  mlc-llm:
    profiles:
      - gpu
    image: nvidia/cuda:12.1.0-devel-ubuntu22.04
    container_name: llm-decision-score-mlc-llm
    ports:
      - "8000:8000"
    environment:
      MLC_MODEL: HF://mlc-ai/gemma-2b-it-q4f16_1-MLC
      MLC_HOST: 0.0.0.0
      MLC_PORT: 8000
    command: >
      bash -c "
        pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cu121 mlc-ai-nightly-cu121 &&
        python -m mlc_llm serve $${MLC_MODEL} --host $${MLC_HOST} --port $${MLC_PORT} --mode interactive
      "
    networks:
      - llm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: llm-decision-score-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - llm-network

volumes:
  pgdata:
  prometheus-data:

networks:
  llm-network:
    driver: bridge
