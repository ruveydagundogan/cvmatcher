services:
  - type: web
    name: llm-decision-score-api
    runtime: go
    buildCommand: cd backend && go build -tags netgo -ldflags '-s -w' -o app ./cmd/server
    startCommand: cd backend && ./app
    envVars:
      - key: GO_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: llm-decision-score-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: llm-decision-score-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: llm-decision-score-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: llm-decision-score-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: llm-decision-score-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MLC_LLM_ENABLED
        value: "true"
      - key: MLC_LLM_BASE_URL
        value: "/tunnel"
    healthCheckPath: /health/live
    autoDeploy: true

databases:
  - name: llm-decision-score-db
    plan: free
    databaseName: llmdecisionscore
    user: llmdecisionscore
